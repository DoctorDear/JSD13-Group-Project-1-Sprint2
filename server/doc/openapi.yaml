        "403":
          $ref: "#/components/responses/ForbiddenAdmin"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"

  # ============================================================================
  # UPLOADS (/api/v1/uploads)
  # ============================================================================
  /api/v1/uploads/images:
    post:
      tags: [Uploads]
      summary: "[Admin] Upload an image to Cloudflare R2"
      description: |
        Protected by 6 middleware layers: `verifyToken` → `requireAdmin` → `validateUploadOrigin` → `imageUploadRateLimit` (20 req/min per admin user) → `parseImageUpload` (Multer memoryStorage, max 5 MB) → `handleImageUploadParseError`.
        Validates real image bytes via `sharp` (non-animated JPEG, PNG, or WebP, ≤ 25 MP), uploads to Cloudflare R2, and generates thumbnails automatically when `purpose === "product"`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: Non-animated JPEG, PNG, or WebP image (max 5 MB, ≤ 25 MP)
                purpose:
                  type: string
                  enum: [product, product-back, template-back]
      responses:
        "201":
          description: Image uploaded to R2
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, example: "uploads/product/uuid.webp" }
                  url: { type: string, format: uri }
                  contentType: { type: string, example: "image/webp" }
                  size: { type: integer }
                  width: { type: integer }
                  height: { type: integer }
        "400":
          description: Missing file, invalid purpose, or malformed multipart upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not admin or disallowed `Origin` header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "413":
          description: File exceeds 5 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "415":
          description: Unsupported/animated image format or exceeds 25 megapixels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "429":
          description: Rate limit exceeded (20 uploads per minute per admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "503":
          description: Cloudflare R2 storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

# ==============================================================================
# REUSABLE COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  responses:
    Unauthorized:
      description: Missing, invalid, or expired `accessToken` cookie
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenAdmin:
      description: Authenticated user does not have `admin` role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }

    MessageError:
      type: object
      properties:
        message: { type: string }

    LegacyError:
      type: object
      properties:
        error: { type: string }

    UserSummary:
      type: object
      properties:
        _id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            phone: { type: string }
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/Address"
            cart:
              type: array
              items:
                $ref: "#/components/schemas/CartItem"
            wishlist:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ShippingAddress:
      type: object
      properties:
        recipientName: { type: string, example: "Somchai Jaidee" }
        phone: { type: string, example: "0812345678" }
        addressLine: { type: string, example: "123 Sukhumvit Rd" }
        subdistrict: { type: string, example: "Khlong Toei" }
        district: { type: string, example: "Khlong Toei" }
        province: { type: string, example: "Bangkok" }
        postalCode: { type: string, example: "10110" }

    Address:
      allOf:
        - type: object
          properties:
            _id: { type: string }
            isDefault: { type: boolean }
        - $ref: "#/components/schemas/ShippingAddress"

    CartItem:
      type: object
      properties:
        _id: { type: string }
        productId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Product"
        size: { type: string, example: "L" }
        customName: { type: string }
        customNumber: { type: string, nullable: true }
        sleeveBadge: { type: string, enum: [none, premier-league, premier-league-racism] }
        namePrice: { type: number }
        numberPrice: { type: number }
        badgePrice: { type: number }
        quantity: { type: integer, minimum: 1 }
        price: { type: number }

    ProductInput:
      type: object
      required: [sku, name, description, price, quantity]
      properties:
        sku: { type: string, example: "LFC-2627-HOME-PLY" }
        groupId: { type: string, nullable: true, example: "LFC-2627-HOME" }
        personalizationEnabled: { type: boolean, default: false }
        personalizationGroupId: { type: string, nullable: true }
        edition: { type: string, nullable: true, example: "Player Edition" }
        brand: { type: string, default: "Adidas" }
        name: { type: string, example: "Liverpool Home Jersey 26/27" }
        description: { type: string }
        price: { type: number, minimum: 0, example: 2900 }
        originalPrice: { type: number, default: 0 }
        cost: { type: number, default: 0 }
        quantity: { type: integer, minimum: 0, example: 25 }
        tag:
          type: array
          items: { type: string }
        category: { type: string, default: "Premier League" }
        fit: { type: string, nullable: true, enum: [slim, regular, relaxed, oversized] }
        kitType: { type: string, nullable: true, enum: [home, away, third, goalkeeper, training, lifestyle] }
        activity: { type: string, enum: [football, training, lifestyle], default: football }
        images:
          type: array
          items: { type: string }
        backImageUrl: { type: string }
        sizes:
          type: array
          items: { type: string }
          example: ["S", "M", "L", "XL", "2XL"]
        isActive: { type: boolean, default: true }

    Product:
      allOf:
        - type: object
          properties:
            _id: { type: string }
            date: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: "#/components/schemas/ProductInput"

    OrderItem:
      type: object
      properties:
        productId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/Product"
        cartItemId: { type: string }
        sku: { type: string }
        name: { type: string }
        edition: { type: string, nullable: true }
        size: { type: string }
        customName: { type: string }
        customNumber: { type: string, nullable: true }
        sleeveBadge: { type: string, enum: [none, premier-league, premier-league-racism] }
        namePrice: { type: number }
        numberPrice: { type: number }
        badgePrice: { type: number }
        price: { type: number }
        quantity: { type: integer }

    Order:
      type: object
      properties:
        _id: { type: string }
        orderNumber: { type: string, example: "ZT-65F1A2B3C4D5E6F7A8B9C0D1" }
        userId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/UserSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        payment:
          type: object
          properties:
            method: { type: string, example: "Credit Card" }
            status: { type: string, example: "paid" }
            paidAt: { type: string, format: date-time, nullable: true }
            transactionId: { type: string }
            stripeSessionId: { type: string }
            reservationState: { type: string, enum: [held, restarting, committed, released] }
            reservationExpiresAt: { type: string, format: date-time, nullable: true }
            retryStartedAt: { type: string, format: date-time, nullable: true }
            cartCleared: { type: boolean }
            cartManaged: { type: boolean }
            replacedBy: { type: string, nullable: true }
        totalAmount: { type: number }
        orderStatus:
          type: string
          enum: [pending, processing, shipped, completed, cancelled]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DetailedRatings:
      type: object
      properties:
        comfort: { type: number, nullable: true, minimum: 1, maximum: 5 }
        quality: { type: number, nullable: true, minimum: 1, maximum: 5 }
        fit: { type: number, nullable: true, minimum: 1, maximum: 5 }
        length: { type: number, nullable: true, minimum: 1, maximum: 5 }

    ReviewSerialized:
      type: object
      properties:
        id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        detailedRatings:
          $ref: "#/components/schemas/DetailedRatings"
        title: { type: string }
        body: { type: string }
        tags:
          type: array
          items: { type: string }
        isRecommended: { type: boolean, nullable: true }
        verifiedPurchase: { type: boolean }
        helpfulCount: { type: integer }
        createdAt: { type: string, format: date-time }
        reviewer:
          type: object
          properties:
            name: { type: string }
            initials: { type: string }

    PersonalizationTextStyle:
      type: object
      required: [x, y, fontId, fontSize, fontWeight, letterSpacing, fill, stroke, strokeWidth]
      properties:
        x: { type: number }
        y: { type: number }
        fontId: { type: string, enum: [barlow-condensed-900] }
        fontSize: { type: number }
        fontWeight: { type: number }
        letterSpacing: { type: number }
        fill: { type: string, example: "#FFFFFF" }
        stroke: { type: string, example: "#000000" }
        strokeWidth: { type: number }

    PersonalizationTemplate:
      type: object
      required: [groupId, active, backImageUrl, viewBox, name, number, sleeveBadge, sleeveBadgeOptions]
      properties:
        _id: { type: string }
        groupId: { type: string, example: "LFC-2627-HOME" }
        active: { type: boolean, default: true }
        backImageUrl: { type: string }
        viewBox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        name:
          $ref: "#/components/schemas/PersonalizationTextStyle"
        number:
          $ref: "#/components/schemas/PersonalizationTextStyle"
        sleeveBadge:
          type: object
          required: [x, y, rotate, skewY, scaleX, scaleY, zoomViewBox, clipPath]
          properties:
            x: { type: number }
            y: { type: number }
            rotate: { type: number }
            skewY: { type: number }
            scaleX: { type: number }
            scaleY: { type: number }
            zoomViewBox:
              type: array
              minItems: 4
              maxItems: 4
              items: { type: number }
            clipPath: { type: string }
        sleeveBadgeOptions:
          type: array
          items:
            type: string
            enum: [none, premier-league, premier-league-racism]
