        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /api/v1/products/{productId}/reviews/mine:
    get:
      tags: [Reviews]
      summary: Get current user's existing review for this product
      security:
