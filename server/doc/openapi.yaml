  # ============================================================================
  # ORDERS & STRIPE (/api/v1/orders + /api/v1/stripe/webhook)
  # ============================================================================
  /api/v1/orders/payment-options:
    get:
      tags: [Orders & Stripe]
      summary: Check enabled Stripe payment methods
      description: Public endpoint returning whether `card` and `promptpay` are configured via server environment variables (`sk_test_*`, `STRIPE_WEBHOOK_SECRET`, `STRIPE_PROMPTPAY_ENABLED`).
      responses:
        "200":
          description: Available online payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  card: { type: boolean }
                  promptpay: { type: boolean }

  /api/v1/orders/my-orders:
    get:
      tags: [Orders & Stripe]
      summary: List current user's orders
      description: Returns orders belonging to `req.user.userId`, newest first, with populated item images/active flags.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User's orders returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orders:
    post:
      tags: [Orders & Stripe]
      summary: Create a Cash-on-Delivery (COD) order from current cart
      description: |
        Only accepts `paymentMethod: "cod"`. Validates shipping address, re-prices every cart item server-side, atomically decrements product stock (rolling back on failure), creates the order, and empties the user's cart.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                paymentMethod:
                  type: string
                  enum: [cod]
                  default: cod
                shippingAddress:
                  $ref: "#/components/schemas/ShippingAddress"
      responses:
        "201":
          description: COD order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Order created successfully" }
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Non-COD method, invalid address, empty cart, invalid personalization, or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: A product in cart was not found or is inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Orders & Stripe]
      summary: "[Admin] List all orders in the system"
      description: Supports optional `status` filter and `sort` (`newest` or `oldest`).
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, shipped, completed, cancelled]
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: All matching orders returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          description: Invalid status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdmin"

  /api/v1/orders/checkout-session:
    post:
      tags: [Orders & Stripe]
      summary: Start a Stripe Checkout Session from current cart
      description: |
        1. Reconciles any previously `held` Stripe orders for this user (returns `409` if one just expired so the user reviews their restored cart).
        2. Re-prices personalization server-side and atomically reserves stock (`reservationState: "held"`, expires in 30 minutes).
        3. Creates a Stripe Checkout Session (`currency: "thb"`, idempotency key `order-<id>`), saves `stripeSessionId`, removes ordered items from cart, and returns the hosted Stripe `url`.
        4. Automatically expires the Stripe session and rolls back stock on any error.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod, shippingAddress]
              properties:
                paymentMethod:
                  type: string
                  enum: [card, promptpay]
                  example: card
                shippingAddress:
                  $ref: "#/components/schemas/ShippingAddress"
      responses:
        "201":
          description: Stripe Checkout Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  url: { type: string, format: uri }
                  orderId: { type: string }
        "400":
          description: Invalid paymentMethod, PromptPay disabled, invalid address, empty cart, or invalid item/personalization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Earlier checkout still preparing/expired, or insufficient stock during atomic reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Stripe or server error (reserved stock rolled back)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}:
    get:
      tags: [Orders & Stripe]
      summary: Get single order details (Owner or Admin)
      description: Verifies ownership or admin role. Also triggers `syncStripeOrder(order)` on read to reconcile pending Stripe payments if webhook delivery lagged.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User is neither the order owner nor an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}/checkout-session:
    get:
      tags: [Orders & Stripe]
      summary: Resume an active Stripe Checkout Session for an unpaid order
      description: Looks up a `held` order owned by the user, checks Stripe to confirm the session is still `open`, and returns its hosted checkout `url`.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active Stripe Checkout URL returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  url: { type: string, format: uri }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Active held checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stripe checkout session is no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}/checkout-session/retry:
    post:
      tags: [Orders & Stripe]
      summary: Retry payment on an existing unpaid/failed Stripe order
      description: |
        Restarts Stripe checkout on the **same order** (without touching the user's current cart):
        - If the previous session is still `open`, marks `reservationState: "restarting"`, expires the old Stripe session, and creates a replacement session keeping the reserved stock.
        - If the previous attempt already failed/released stock, re-reserves stock from `order.items` and opens a fresh Stripe session.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod:
                  type: string
                  enum: [card, promptpay]
                  example: card
                shippingAddress:
                  $ref: "#/components/schemas/ShippingAddress"
                  description: Optional override; defaults to the existing order's shippingAddress
      responses:
        "201":
          description: Replacement Stripe Checkout Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  url: { type: string, format: uri }
                  orderId: { type: string }
        "400":
          description: Invalid paymentMethod, PromptPay disabled, or unavailable item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not eligible, already paid, concurrent retry in progress, or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}/status:
    patch:
      tags: [Orders & Stripe]
      summary: "[Admin] Update order fulfillment status"
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Accepts either `orderStatus` or `status`
              properties:
                orderStatus:
                  type: string
                  enum: [pending, processing, shipped, completed, cancelled]
                  example: shipped
                status:
                  type: string
                  enum: [pending, processing, shipped, completed, cancelled]
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Order status updated successfully" }
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Invalid ObjectId or invalid status enum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdmin"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/stripe/webhook:
    post:
      tags: [Orders & Stripe]
      summary: "[Stripe] Receive signed Stripe webhook events"
      description: |
        Mounted in `server.js` **before** `express.json()` using `express.raw({ type: "application/json" })` so Stripe's HMAC signature verification receives the exact raw request body.
        - Handles `checkout.session.completed`, `checkout.session.async_payment_succeeded`, `checkout.session.async_payment_failed`, and `checkout.session.expired`.
        - Ignores events from stale/replaced sessions (`stripeSessionId !== session.id`) or orders currently in `restarting` state.
        - Returns `503` if the order record is not found yet so Stripe retries delivery.
      parameters:
        - name: stripe-signature
          in: header
          required: true
          description: Stripe HMAC signature header verified against `STRIPE_WEBHOOK_SECRET`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe Event JSON payload
      responses:
        "200":
          description: Event processed or safely ignored
        "400":
          description: Invalid or missing Stripe webhook signature
        "500":
          description: Unexpected webhook processing error
        "503":
          description: Order not yet found (signals Stripe to retry)

