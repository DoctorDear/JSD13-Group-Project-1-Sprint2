openapi: 3.0.3
info:
  title: Zeta Jersey Store API
  version: 1.0.0
  description: |
    Complete interactive API reference for the **Zeta Jersey Store** backend (Express 5 + MongoDB + Stripe + Cloudflare R2).

    ### Authentication Notes
    - Protected routes use an `httpOnly` cookie named **`accessToken`** verified by `verifyToken`.
    - Admin routes additionally require `requireAdmin` (`user.role === "admin"`), returning `403` otherwise.
    - **Quick test tip:** Call `POST /api/v1/auth/login` right here first — your browser will store the `accessToken` cookie automatically for subsequent requests.

servers:
  - url: /
    description: Current server

tags:
  - name: System
    description: Health check endpoint
  - name: Auth
    description: Registration, login, logout, session lookup, and password changes
  - name: Users - Profile & Addresses
    description: Authenticated user profile, shipping addresses, and personal review list
  - name: Users - Cart
    description: Shopping cart CRUD with server-side personalization pricing
  - name: Users - Wishlist
    description: Saved wishlist products
  - name: Products
    description: Storefront catalog and Admin inventory management
  - name: Reviews
    description: Verified-purchaser product reviews, eligibility checks, and summaries
  - name: Orders & Stripe
    description: COD checkout, Stripe Checkout sessions, resume/retry, webhooks, and Admin order management
  - name: Personalization Templates
    description: Jersey print/badge preview templates (public lookup + Admin CRUD)
  - name: Uploads
    description: Admin image uploads to Cloudflare R2 with Sharp validation & thumbnails

paths:
  # ============================================================================
  # SYSTEM
  # ============================================================================
  /health:
    get:
      tags: [System]
      summary: Server health check
      description: Public lightweight liveness endpoint (no DB or auth required). Also used by Render cold-start checks.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ============================================================================
  # AUTH (/api/v1/auth)
  # ============================================================================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      description: Creates a new user with bcrypt-hashed password (12 salt rounds). Does not auto-login or set a cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                  example: Dear
                lastName:
                  type: string
                  example: Zeta
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "User registered successfully!" }
                  data:
                    $ref: "#/components/schemas/UserSummary"
        "400":
          description: Missing required fields or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      description: Validates credentials, issues a 7-day JWT, sets an `httpOnly` `accessToken` cookie, and also returns `token` in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: "Secret123!"
      responses:
        "200":
          description: Login successful (sets httpOnly `accessToken` cookie)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Login successful!" }
                  token: { type: string }
                  user:
                    $ref: "#/components/schemas/UserSummary"
        "400":
          description: Missing fields or invalid email/password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      description: Clears the `accessToken` cookie via `res.clearCookie("accessToken")`. Public route (no auth guard).
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Logged out successfully!" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: Looks up the logged-in user by `req.user.userId` and returns the user document excluding `password`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authenticated user returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/change-password:
    patch:
      tags: [Auth]
      summary: Change current user's password
      description: Hashes and replaces the logged-in user's password. Note that current password is not required by the current implementation.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword, confirmPassword]
              properties:
                newPassword:
                  type: string
                  format: password
                  example: "NewSecret123!"
                confirmPassword:
                  type: string
                  format: password
                  example: "NewSecret123!"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Password changed successfully!" }
        "400":
          description: Missing fields or passwords do not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ============================================================================
  # USERS - PROFILE, ADDRESSES & MY REVIEWS (/api/v1/users)
  # ============================================================================
  /api/v1/users/profile:
    get:
      tags: [Users - Profile & Addresses]
      summary: Get authenticated user's full profile
      description: Returns user profile including addresses, cart, and wishlist (excluding password).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User profile returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [Users - Profile & Addresses]
      summary: Update profile and/or default address
      description: Updates `firstName`, `lastName`, `phone`, and optionally updates (or creates) the user's default `address`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, minLength: 2, example: Dear }
                lastName: { type: string, minLength: 2, example: Zeta }
                phone: { type: string, example: "0812345678" }
                address:
                  $ref: "#/components/schemas/ShippingAddress"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Profile updated successfully" }
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      errors:
                        type: array
                        items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/reviews:
    get:
      tags: [Users - Profile & Addresses]
      summary: List reviews written by the current user
      description: Returns all reviews authored by `req.user.userId`, newest first, with populated product summary.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User's reviews returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        product:
                          type: object
                          nullable: true
                          properties:
                            id: { type: string }
                            name: { type: string }
                            images:
                              type: array
                              items: { type: string }
                        orderId: { type: string, nullable: true }
                        rating: { type: integer }
                        detailedRatings:
                          $ref: "#/components/schemas/DetailedRatings"
                        isRecommended: { type: boolean, nullable: true }
                        title: { type: string }
                        body: { type: string }
                        status: { type: string, enum: [pending, published, hidden] }
                        createdAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/address:
    post:
      tags: [Users - Profile & Addresses]
      summary: Add a new shipping address
      description: "Appends an address to `user.addresses`. If `isDefault: true`, unsets `isDefault` on all existing addresses."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ShippingAddress"
                - type: object
                  required: [recipientName, phone, addressLine, province, postalCode]
                  properties:
                    isDefault: { type: boolean, example: true }
      responses:
        "201":
          description: Address added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Address added successfully" }
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "400":
          description: Missing required address fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/address/{addressId}:
    patch:
      tags: [Users - Profile & Addresses]
      summary: Update a shipping address by subdocument ID
      security:
        - cookieAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ShippingAddress"
                - type: object
                  properties:
                    isDefault: { type: boolean }
      responses:
        "200":
          description: Address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Address updated successfully" }
                  address:
                    $ref: "#/components/schemas/Address"
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "400":
          description: Empty required field or no valid update fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User or address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Users - Profile & Addresses]
      summary: Delete a shipping address by subdocument ID
      security:
        - cookieAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Address deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Address deleted successfully" }
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User or address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  # USERS - CART (/api/v1/users/cart)
  # ============================================================================
  /api/v1/users/cart:
    get:
      tags: [Users - Cart]
      summary: Get current user's cart
      description: Returns `user.cart` with populated `productId` details.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cart returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  cart:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Users - Cart]
      summary: Add item to cart (merges identical product + size + personalization)
      description: |
        Validates product availability and personalization rules (`customName` and `customNumber` must be provided together; number is 0–99), calculates prices server-side via `pricePersonalization`, and increments quantity if an identical line already exists.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, size, quantity]
              properties:
                productId: { type: string, example: "65f1a2b3c4d5e6f7a8b9c0d1" }
                size: { type: string, example: "L" }
                quantity: { type: integer, minimum: 1, example: 1 }
                customName: { type: string, example: "SALAH" }
                customNumber: { type: string, nullable: true, example: "11" }
                sleeveBadge:
                  type: string
                  enum: [none, premier-league, premier-league-racism]
                  default: none
      responses:
        "200":
          description: Item added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Added to cart successfully" }
                  cart:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
        "400":
          description: Invalid product/size/quantity or invalid personalization choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Users - Cart]
      summary: Clear all items from cart
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Cart cleared successfully" }
                  cart:
                    type: array
                    items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/cart/{itemId}:
    patch:
      tags: [Users - Cart]
      summary: Update cart item quantity
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          description: MongoDB subdocument `_id` of the cart line item
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, example: 2 }
      responses:
        "200":
          description: Cart item quantity updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Cart item quantity updated" }
                  cart:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
        "400":
          description: Quantity is less than 1 or not an integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User or cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Users - Cart]
      summary: Remove a single cart item
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Item removed from cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Item removed from cart" }
                  cart:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  # USERS - WISHLIST (/api/v1/users/wishlist)
  # ============================================================================
  /api/v1/users/wishlist:
    get:
      tags: [Users - Wishlist]
      summary: Get current user's wishlist
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Populated wishlist products returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  wishlist:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/users/wishlist/{productId}:
    post:
      tags: [Users - Wishlist]
      summary: Add product to wishlist (idempotent via $addToSet)
      security:
        - cookieAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated wishlist returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  wishlist:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Users - Wishlist]
      summary: Remove product from wishlist
      security:
        - cookieAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated wishlist returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  wishlist:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  # PRODUCTS (/api/v1/products)
  # ============================================================================
  /api/v1/products:
    get:
      tags: [Products]
      summary: List active storefront products
      description: Supports search across `name`, `description`, `tag`, exact case-insensitive filters (`category`, `edition`, `tag`), `sort=best-selling` (aggregated from non-cancelled orders), and `limit` (max 50). Returns a raw JSON array.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          description: Hyphens are converted to spaces (e.g. `premier-league` -> `premier league`)
          schema: { type: string }
        - name: edition
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, best-selling]
            default: newest
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Array of active products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

    post:
      tags: [Products]
      summary: "[Admin] Create a new product"
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdmin"

  /api/v1/products/admin:
    get:
      tags: [Products]
      summary: "[Admin] List all products including inactive items"
      description: Same filters/sorting as `GET /api/v1/products`, but sets `req.includeInactiveProducts = true`.
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: edition
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, best-selling], default: newest }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Array of all products (active + inactive)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdmin"

  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get single active product with variants & personalization template
      description: Fetches the product, any active sibling variants sharing the same `groupId`, and its resolved `personalizationTemplate`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: "#/components/schemas/Product"
                  variants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  personalizationTemplate:
                    $ref: "#/components/schemas/PersonalizationTemplate"
                    nullable: true
        "404":
          description: Product not found or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"

    patch:
      tags: [Products]
      summary: "[Admin] Update a product by ID"
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
