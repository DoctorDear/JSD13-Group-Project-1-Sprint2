              $ref: "#/components/schemas/PersonalizationTemplate"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    $ref: "#/components/schemas/PersonalizationTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenAdmin"

    patch:
      tags: [Personalization Templates]
