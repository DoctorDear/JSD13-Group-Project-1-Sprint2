  # ============================================================================
  # REVIEWS (/api/v1/products/{productId}/reviews)
  # ============================================================================
  /api/v1/products/{productId}/reviews:
    get:
      tags: [Reviews]
      summary: List published reviews + aggregated rating summary for a product
      description: Paginated list of published reviews along with average rating, recommendation rate, detailed rating averages, rating distribution, and top tags.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: rating
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: tags
          in: query
          description: Comma-separated tag filter (e.g. `Breathable,True to size`)
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, highest, lowest, helpful]
            default: newest
      responses:
        "200":
          description: Paginated reviews and aggregated summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewSerialized"
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      averageRating: { type: number }
                      recommendRate: { type: integer, description: "Percentage 0-100" }
                      detailedRatings:
                        $ref: "#/components/schemas/DetailedRatings"
                      distribution:
                        type: object
                        additionalProperties: { type: integer }
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            count: { type: integer }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pageCount: { type: integer }
        "400":
          description: Invalid productId or rating query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

    post:
      tags: [Reviews]
      summary: Submit a verified-purchaser product review
      description: Requires a `completed` order containing `productId` and enforces one review per user per product (unique index + 409 check).
      security:
        - cookieAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, body]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
                title: { type: string, maxLength: 120, example: "Great fabric quality" }
                body: { type: string, maxLength: 2000, example: "Fits true to size and print looks sharp." }
                detailedRatings:
                  $ref: "#/components/schemas/DetailedRatings"
                tags:
                  type: array
                  maxItems: 10
                  items: { type: string }
                isRecommended: { type: boolean, example: true }
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                type: object
                properties:
                  review:
                    $ref: "#/components/schemas/ReviewSerialized"
        "400":
          description: Invalid productId, rating, body, or detailedRatings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User has no completed order containing this product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"
        "409":
          description: User has already reviewed this product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /api/v1/products/{productId}/reviews/eligibility:
    get:
      tags: [Reviews]
      summary: Check whether current user can review this product
      description: Checks if the user has a `completed` order with `productId` and has not already submitted a review.
      security:
        - cookieAuth: []
