<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card__media">
        <img src="https://plus.unsplash.com/premium_photo-1747429964769-d12808b90e9d?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
             alt="Man sitting in stadium seats" />
      </div>

      <form class="card__form" id="loginForm" novalidate>
        <h1 class="title">Log in</h1>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <a class="forgot" href="#">Forget Password ?</a>

        <button class="btn" type="submit">Log in</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
