<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Zeta — Verify email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <header class="head">
      <div class="logo">
        Zeta<span class="logo__tag">jersey</span>
      </div>

      <h1 class="title">Verify email</h1>
      <p class="subtitle">Please enter your e-mail</p>
    </header>

    <section class="card">
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Your email" autocomplete="email" />
          <small class="error" data-for="email"></small>
        </div>

        <div class="field">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="new-password" />
          <small class="error" data-for="password"></small>
        </div>

        <button type="submit" class="btn">Reset password</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
