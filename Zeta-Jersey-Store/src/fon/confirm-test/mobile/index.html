<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Email Confirmation — Zeta Jersey</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="screen">
    <header class="brand">
      <h1 class="logo">Zeta<span class="logo__sup">jersey</span></h1>
      <h2 class="title">Email<br />Confirmation</h2>
    </header>

    <section class="card">
      <button class="btn" id="confirmBtn" type="button">Confirm email</button>
      <button class="btn" id="resendBtn" type="button">Resend email</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
