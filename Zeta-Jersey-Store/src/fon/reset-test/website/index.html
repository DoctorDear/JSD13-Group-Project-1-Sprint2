<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeta — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <div class="card">
      <!-- Left: hero image -->
      <section class="card__media">
        <img src="https://plus.unsplash.com/premium_photo-1747861973999-ca58813aaf21?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
             alt="Athlete in a blue jersey" />
        <div class="card__media-overlay">
          <span class="logo">Zeta<sup>Jersey</sup></span>
          <a href="/" class="btn-ghost">Back to website</a>
        </div>
      </section>

      <!-- Right: form -->
      <section class="card__content">
        <h1 class="title">Reset password</h1>
        <p class="subtitle">Password problem ? We got you!</p>

        <form id="resetForm" novalidate>
          <label for="email" class="label">Email</label>
          <input type="email" id="email" name="email" class="input" placeholder="Your email" />
          <p class="error" id="error" role="alert"></p>
          <button type="submit" class="btn-primary" id="submitBtn">Summit email address</button>
          <p class="success" id="success"></p>
        </form>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
